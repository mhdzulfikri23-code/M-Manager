services:
  postgres:
    image: postgres:16-alpine
    container_name: money-manager-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-money_manager}
      POSTGRES_USER: ${POSTGRES_USER:-money_manager}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-money_manager_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - money-manager-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-money_manager} -d ${POSTGRES_DB:-money_manager}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  money-manager-data:
